<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMeans Clustering</title>
    <script src="../Imagelib.js"></script>
    <style>
        body {
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
    
        /* 修改标题样式 */
        h1 {
            color: #2C3E50;
            font-size: 2.5em;
            text-align: center;
            margin-top: 50px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
    
        /* 第二个标题 */
        h1:nth-of-type(2) {
            font-size: 2em;
            color: #3498db;
            margin-top: 10px;
        }
    
        /* 段落样式 */
        p {
            font-size: 18px;
            color: #555;
            text-align: center;
            margin: 30px auto;
            max-width: 800px;
            padding: 0 10px;
            line-height: 1.8;
        }
    
        /* 增加按钮效果 */
        button {
            font-size: 16px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
    
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
    
        /* 小屏幕优化 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
    
            p {
                font-size: 16px;
            }
        }
    </style>
    
</head>
<body>
    <h1>KMeans Clustering</h1>
    <h1>K均值聚类算法</h1>
    <p>对图像进行K均值聚类算法，输出每轮的结果；打开控制台可以看到每轮的聚类距离中心。</p>
    <p>Perform K-means clustering algorithm on the image and output the results of each round; Open the console to see the clustering distance center for each round.</p>

    <script>
        var image = null;
        var cas = document.querySelector('canvas');
        Img.fromurl('../images/dog.png').then(img => {
        //fetch('../images/dog.png').then(x => { return x.blob() }).then(b => { return Img.fromblob(b) }).then(img => {
            img.show();
            //进行k均值聚类
            let runningloop = 30;
            let arr = img.toarray();
            console.log(arr);
            var [tmpcenters, res] = arr.kmeans(k = 4, centers = null, disttype = 'dist');
            console.log(res);
            for (let i = 0; i < runningloop; i++) {
                image = Img.fromarray(res.stretch(0, 255));
                image.show();
                console.log(tmpcenters);
                let kk = arr.kmeans(k = 6, centers = tmpcenters, disttype = 'dist');
                tmpcenters = kk[0];
                res = kk[1];
            }
        });
    </script>
</body>
</html>
